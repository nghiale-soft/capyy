name: capyy

# ==========================================================================
# Capyy — run with `docker compose up -d --build`
#
# Persistent runtime state is stored in this project's ignored `data/` folder:
#   - ./data/config -> /app/config (tokens, providers and tool permissions)
#   - ./data/app    -> /app/data   (chat history and other runtime data)
# ==========================================================================

services:
  capyy:
    build:
      context: .
      dockerfile: Dockerfile
    image: capyy:latest
    container_name: capyy
    environment:
      CAPYY_DB_HOST: mariadb
      CAPYY_DB_PORT: 3306
      CAPYY_DB_NAME: capyy
      CAPYY_DB_USER: root
      CAPYY_DB_PASSWORD: ${CAPYY_DB_PASSWORD:?Add CAPYY_DB_PASSWORD to capyy/.env}
    ports:
      - "1221:1221" # API (OpenAI/Anthropic-compatible)
      - "2222:2222" # Dashboard web
    volumes:
      - ./data/config:/app/config
      - ./data/app:/app/data
      # User-facing timestamps follow the Docker host, not a hard-coded zone.
      - /etc/localtime:/etc/localtime:ro
      # Local AI tool chat history (read-only) so the Dashboard can auto-scan:
      # Claude Code (~/.claude) and Codex CLI (~/.codex)
      - ${HOME}/.claude:/home/appuser/.claude:ro
      - ${HOME}/.codex:/home/appuser/.codex:ro
    networks:
      - common-service
    restart: unless-stopped

networks:
  common-service:
    name: common-service-net
    external: true
