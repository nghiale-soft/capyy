[project]
name = "ai-gateway-provider"
version = "0.1.0"
description = "Multi-provider AI API gateway (OpenAI/Anthropic-compatible)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx[socks]>=0.28.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
ai-gateway = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "providers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
